<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mi Panel</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Mi Panel</h1>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
    <button class="icon-btn" id="btn-ajustes" aria-label="Ajustes" title="Copia de seguridad">⋯</button>
  </header>

  <main id="vista" class="vista"></main>

  <dialog id="dlg-ajustes" class="dialogo">
    <h2>Copia de seguridad</h2>
    <p class="muted">Tus datos se guardan solo en este dispositivo. Exporta una copia para guardarla o pasarla a otro dispositivo.</p>
    <div class="fila-botones">
      <button class="btn" id="btn-exportar">Exportar datos</button>
      <label class="btn btn-sec">Importar datos
        <input type="file" id="inp-importar" accept="application/json" hidden>
      </label>
    </div>
    <form method="dialog"><button class="btn btn-sec ancho">Cerrar</button></form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/entrenos.js"></script>
  <script src="js/gym-plan.js"></script>
  <script src="js/gym.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
